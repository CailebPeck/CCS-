name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android

      - name: Build debug APK (for on-device testing)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Note about signing
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::AAB built UNSIGNED — Google Play will not accept it until signing secrets are configured. See README.md § 'Cloud builds' for the four ANDROID_* secrets to add."

      - name: Upload release bundle
        uses: actions/upload-artifact@v5
        with:
          name: coastline-hub-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: coastline-hub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
