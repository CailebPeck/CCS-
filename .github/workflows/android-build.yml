name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the job refresh the public 'demo' release with the latest APK
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/upload-keystore.jks"
          # Strip every whitespace character first. Pasting the secret from a
          # phone or a wrapped text viewer often carries newlines or stray
          # spaces, which made `base64 -d` fail with a bare "invalid input".
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$ks" 2>/dev/null || true

          if [ ! -s "$ks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to anything. Re-copy the ENTIRE contents of keystore-base64.txt as one line (~3700 characters) and update the secret."
            exit 1
          fi

          # A truncated paste still decodes to *something*, so prove the result
          # is a real keystore that opens with the supplied password before
          # handing it to Gradle — otherwise the failure surfaces much later as
          # a confusing signing error.
          if ! keytool -list -keystore "$ks" -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore decoded but will not open. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (alias should be 'upload'), and that ANDROID_KEYSTORE_BASE64 was copied in full."
            exit 1
          fi
          echo "Keystore decoded and verified ($(wc -c < "$ks") bytes, alias '$KS_ALIAS')."

          {
            echo "ANDROID_KEYSTORE_PATH=$ks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android

      - name: Build debug APK (for on-device testing)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Note about signing
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::AAB built UNSIGNED — Google Play will not accept it until signing secrets are configured. See README.md § 'Cloud builds' for the four ANDROID_* secrets to add."

      - name: Upload release bundle
        uses: actions/upload-artifact@v5
        with:
          name: coastline-hub-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: coastline-hub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Keep a public, one-tap download of the latest demo APK at
      # /releases/tag/demo — installable on any Android phone without
      # a GitHub account. Skipped on pull requests.
      - name: Publish demo APK to public download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk coastline-hub-demo.apk
          gh release view demo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create demo --repo "$GITHUB_REPOSITORY" \
              --title "Coastline Hub — demo app (Android)" \
              --notes "Latest demo build. On your Android phone: tap coastline-hub-demo.apk below, open the download, and allow the install when prompted. Updated automatically on every change."
          gh release upload demo coastline-hub-demo.apk --repo "$GITHUB_REPOSITORY" --clobber
