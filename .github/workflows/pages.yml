name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        # Requires Pages to already be switched on for the repo
        # (Settings → Pages → Source → GitHub Actions). enablement: true does
        # not help here: creating the Pages site needs repo-admin rights, and
        # the workflow GITHUB_TOKEN only has pages: write, so the API call
        # comes back "Resource not accessible by integration".
        uses: actions/configure-pages@v5

      # Stamps the commit SHA into index.html's asset query strings so every
      # deploy busts the browser's disk cache. Runs on the checkout, not the
      # tracked file, so www/index.html in git keeps the __BUILD__ placeholder
      # and local dev (npm start) is unaffected.
      - name: Stamp cache-busting build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" www/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
