<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Coastline Current Solutions — electrical services, Coastline Street streetwear and CCS Tools. Based on the NSW Central Coast.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Coastline Hub</title>
  <!-- Anton carries every heading, so fetch it first. See the note in app.css for
       why the logo's own face (Brothers) is not used for UI text. -->
  <link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <!-- __BUILD__ is replaced with the commit SHA at deploy time (see
       .github/workflows/pages.yml), so every push forces browsers to fetch
       the new files instead of serving a stale copy from disk cache — plain
       filenames never change, so without this a phone that already loaded
       the site can keep showing old content indefinitely. -->
  <link rel="stylesheet" href="css/app.css?v=__BUILD__">
</head>
<body>
  <div id="app"></div>
  <script src="js/data.js?v=__BUILD__"></script>
  <script src="js/store.js?v=__BUILD__"></script>
  <script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
